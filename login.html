<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | Dr. Namita Tiwari</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050816, #071d5c, #102f8f);
            color: white;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 45px 35px;
            border: 1px solid rgba(80, 170, 255, 0.4);
            border-radius: 24px;
            background: rgba(10, 30, 80, 0.75);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b8c7e6;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgba(100, 180, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
        }

        input::placeholder {
            color: #aab8d0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #168cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #36a1ff;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            color: #7dd3fc;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">NT.</div>

        <h1>Portal Login</h1>

        <p class="subtitle">
            Dr. Namita Tiwari | Academic Portal
        </p>

        <form onsubmit="loginUser(event)">

        
            <input type="email" id="email" placeholder="Email Address" required>

            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <a href="index.html" class="back">← Back to Website</a>

    </div>
    <script>
function loginUser(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "maam@example.com" && password === "12345") {
        window.location.href = "portal.html";
    } else {
        alert("Invalid email or password.");
    }
}
</script>


</body>
</html>
